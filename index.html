<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>音频无限循环器 Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LoopTool">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
            overscroll-behavior-y: contain; 
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { margin: 0 0 20px 0; color: #1a73e8; text-align: center; font-size: 22px; }
        
        .dashboard {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
            font-size: 14px;
        }
        .dash-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .dash-row:last-child { margin-bottom: 0; }
        .dash-label { color: #666; }
        .dash-value { font-weight: bold; color: #333; }
        .highlight { color: #d93025; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        
        input[type="file"] {
            display: block; width: 100%; padding: 10px;
            background: #fff; border: 2px dashed #ccc; border-radius: 8px;
            box-sizing: border-box; 
        }
        input[type="number"], input[type="text"] {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 16px; box-sizing: border-box; 
        }
        
        button {
            width: 100%; padding: 15px;
            background-color: #1a73e8; color: white;
            border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .progress-area { margin-top: 15px; display: none; text-align: center; }
        .status { font-size: 14px; color: #666; margin-bottom: 5px; }
        
        .download-btn {
            display: none; margin-top: 15px;
            background-color: #34a853; color: white;
            padding: 15px; border-radius: 8px; font-weight: bold;
            text-align: center; text-decoration: none; display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 音频无限循环器 Pro</h2>
    
    <!-- 新增：信息仪表盘 -->
    <div class="dashboard">
        <div class="dash-row">
            <span class="dash-label">原始时长:</span>
            <span class="dash-value" id="valDuration">--:--</span>
        </div>
        <div class="dash-row">
            <span class="dash-label">预计总长:</span>
            <span class="dash-value highlight" id="valTotalDuration">--:--</span>
        </div>
        <div class="dash-row">
            <span class="dash-label">预计体积:</span>
            <span class="dash-value" id="valSize">-- MB</span>
        </div>
    </div>

    <div class="form-group">
        <label>1. 选择文件 (MP3)</label>
        <input type="file" id="fileInput" accept=".mp3">
    </div>

    <div class="form-group">
        <label>2. 重复次数</label>
        <input type="number" id="loopCount" value="108" min="2">
    </div>

    <div class="form-group">
        <label>3. 文件名 (可选)</label>
        <input type="text" id="fileNameInput" placeholder="自动生成...">
    </div>

    <button id="processBtn" onclick="processAudio()">开始处理</button>

    <div class="progress-area" id="progressArea">
        <div class="status" id="statusText">准备就绪</div>
        <progress id="progressBar" value="0" max="100" style="width: 100%; height: 6px;"></progress>
    </div>

    <a id="downloadLink" class="download-btn" style="display:none">📥 下载结果</a>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW失败', err));
        });
    }

    // === 变量引用 ===
    const fileInput = document.getElementById('fileInput');
    const fileNameInput = document.getElementById('fileNameInput');
    const countInput = document.getElementById('loopCount');
    const valDuration = document.getElementById('valDuration');
    const valTotalDuration = document.getElementById('valTotalDuration');
    const valSize = document.getElementById('valSize');
    
    let currentFileDuration = 0; // 秒

    // === 辅助函数：格式化时间 ===
    function formatTime(seconds) {
        if (!seconds) return "--:--";
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // === 更新仪表盘数据 ===
    function updateDashboard() {
        const count = parseInt(countInput.value) || 0;
        
        // 1. 更新总时长
        if (currentFileDuration > 0 && count > 0) {
            valTotalDuration.innerText = formatTime(currentFileDuration * count);
        } else {
            valTotalDuration.innerText = "--:--";
        }

        // 2. 更新预计体积
        if (fileInput.files.length > 0 && count > 0) {
            const fileSizeMB = fileInput.files[0].size / 1024 / 1024;
            const totalSizeMB = fileSizeMB * count;
            valSize.innerText = `≈ ${totalSizeMB.toFixed(2)} MB`;
        } else {
            valSize.innerText = "-- MB";
        }
    }

    // === 文件选择监听 ===
    fileInput.addEventListener('change', function() {
        if (this.files && this.files.length > 0) {
            const file = this.files[0];
            
            // 1. 获取音频时长
            const audioObj = new Audio(URL.createObjectURL(file));
            audioObj.addEventListener('loadedmetadata', () => {
                currentFileDuration = audioObj.duration;
                valDuration.innerText = formatTime(currentFileDuration);
                updateDashboard(); // 重新计算总数据
            });

            // 2. 自动填文件名
            const originalName = file.name.replace(/\.[^/.]+$/, "");
            fileNameInput.value = `${originalName}_${countInput.value}x.mp3`;
            
            updateDashboard();
        }
    });

    // === 次数变化监听 ===
    countInput.addEventListener('input', function() {
        updateDashboard();
        // 更新文件名中的次数
        if (fileInput.files.length > 0) {
            const currentName = fileNameInput.value;
            if (currentName.match(/_\d+x/)) {
                 const file = fileInput.files[0];
                 const originalName = file.name.replace(/\.[^/.]+$/, "");
                 fileNameInput.value = `${originalName}_${this.value}x.mp3`;
            }
        }
    });

    // === 核心处理逻辑 (保持不变) ===
    async function processAudio() {
        const statusText = document.getElementById('statusText');
        const processBtn = document.getElementById('processBtn');
        const downloadLink = document.getElementById('downloadLink');
        const progressArea = document.getElementById('progressArea');
        const progressBar = document.getElementById('progressBar');

        if (!fileInput.files.length) { alert('请先选择 MP3！'); return; }
        
        const file = fileInput.files[0];
        const count = parseInt(countInput.value);
        if (count < 2) { alert('次数太少'); return; }

        processBtn.disabled = true;
        processBtn.innerText = "处理中...";
        downloadLink.style.display = 'none';
        progressArea.style.display = 'block';
        
        try {
            statusText.innerText = "读取数据...";
            const arrayBuffer = await file.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);

            // 智能头尾分析
            let startOffset = 0; 
            let endOffset = uint8Array.length; 
            if (uint8Array[0]===0x49 && uint8Array[1]===0x44 && uint8Array[2]===0x33) {
                const size = (uint8Array[6]<<21)|(uint8Array[7]<<14)|(uint8Array[8]<<7)|uint8Array[9];
                startOffset = 10 + size;
            }
            if (uint8Array.length > 128) {
                const idx = uint8Array.length - 128;
                if (uint8Array[idx]===0x54 && uint8Array[idx+1]===0x41 && uint8Array[idx+2]===0x47) {
                    endOffset = idx;
                }
            }

            const firstPart = uint8Array.slice(0, endOffset);
            const repeatPart = uint8Array.slice(startOffset, endOffset);
            const blobParts = [firstPart];

            // 循环拼接
            const chunkSize = 50;
            for (let i=1; i<count; i++) {
                blobParts.push(repeatPart);
                if (i % chunkSize === 0) {
                    const pct = Math.round((i/count)*100);
                    statusText.innerText = `拼接进度: ${pct}%`;
                    progressBar.value = pct;
                    await new Promise(r => setTimeout(r, 0));
                }
            }
            progressBar.value = 100;

            // 生成文件
            const finalBlob = new Blob(blobParts, { type: 'audio/mpeg' });
            const url = URL.createObjectURL(finalBlob);
            
            let finalName = fileNameInput.value.trim();
            if (!finalName) finalName = file.name.replace(/\.[^/.]+$/, "") + `_${count}x.mp3`;
            if (!finalName.toLowerCase().endsWith('.mp3')) finalName += '.mp3';
            
            downloadLink.href = url;
            downloadLink.download = finalName;
            downloadLink.style.display = 'block';
            downloadLink.innerText = `✅ 下载文件 (${(finalBlob.size/1024/1024).toFixed(2)} MB)`;
            statusText.innerText = "处理完成！";

        } catch (e) {
            alert("错误: " + e.message);
            statusText.innerText = "失败";
        } finally {
            processBtn.disabled = false;
            processBtn.innerText = "开始处理";
        }
    }
</script>
</body>
</html>
